<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Подход — дневник тренировок</title>
<meta name="description" content="Дневник тренировок: подходы, веса, таймер отдыха, программы и разбор в Claude">
<meta name="theme-color" content="#F2F3F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2F3F5; --card: #FFFFFF; --card2: #E8EBF0; --ink: #16181D; --muted: #5B6271; --line: #D3D8E0;
    --brand: #2B67D1; --brand-ink: #FFFFFF; --soft: #E1EAFA; --ok: #1B8A4B; --ok-soft: #DDF3E6; --warn: #C04A22;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111317; --card: #1C1F25; --card2: #272B33; --ink: #ECEEF2; --muted: #9BA2AF; --line: #353A45;
      --brand: #79A4F2; --brand-ink: #0D1422; --soft: #1E2A3F; --ok: #52C786; --ok-soft: #173326; --warn: #F08B65;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.4 Rubik, system-ui, sans-serif; }
  #app { max-width: 400px; margin: 0 auto; padding: 12px 16px 48px; }
  h1 { font-size: 18px; margin: 0; }
  h2 { font-size: 18px; margin: 18px 0 8px; }
  h3 { font-size: 16px; margin: 0; }
  p { margin: 6px 0; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .xs { font-size: 12px; }
  .mono { font-family: "Roboto Mono", ui-monospace, monospace; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  input, select, textarea {
    width: 100%; min-height: 48px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--ink);
  }
  textarea { min-height: 96px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: 0; border-color: var(--brand); }
  label.f { display: block; margin: 10px 0; font-size: 14px; color: var(--muted); }
  label.f > input, label.f > select, label.f > textarea { margin-top: 4px; font-size: 16px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 0 16px;
    border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-weight: 500; text-decoration: none;
  }
  .btn.main { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .btn.wide { width: 100%; }
  .btn.sm { min-height: 44px; padding: 0 12px; font-size: 14px; }
  .btn.ghost { background: transparent; }
  .btn.danger { color: var(--warn); }
  .link { background: none; border: 0; color: var(--brand); padding: 0 4px; min-height: 44px; font-size: 14px; text-decoration: underline; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  .row > .no { flex: 0 0 auto; }
  .stack > * + * { margin-top: 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin: 10px 0; }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--card2); color: var(--muted); }
  .chip.live { background: var(--brand); color: var(--brand-ink); }
  .chip.done { background: var(--ok-soft); color: var(--ok); }
  .hint { font-size: 14px; color: var(--muted); }
  .msg { font-size: 14px; color: var(--brand); min-height: 20px; }
  .err { color: var(--warn); }

  /* навигация: обычный блок вверху, не закреплён */
  #nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
  #nav button { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-size: 14px; font-weight: 500; }
  #nav button.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0 10px; }
  .top h1 { flex: 1; }

  /* неделя */
  .weekhead { display: flex; align-items: center; gap: 6px; }
  .weekhead .m { flex: 1; text-align: center; font-weight: 500; text-transform: capitalize; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 8px 0 4px; }
  .week button { min-height: 56px; border: 1px solid transparent; border-radius: 12px; background: transparent; padding: 4px 0; line-height: 1.2; }
  .week button b { display: block; font-size: 18px; font-weight: 500; }
  .week button span { font-size: 12px; color: var(--muted); }
  .week button.today { border-color: var(--line); }
  .week button.sel { background: var(--brand); color: var(--brand-ink); }
  .week button.sel span { color: var(--brand-ink); }
  .week button i { display: block; width: 6px; height: 6px; border-radius: 50%; margin: 2px auto 0; background: transparent; }
  .week button.has i { background: var(--brand); }
  .week button.sel.has i { background: var(--brand-ink); }

  .wcard { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin: 10px 0; }
  .wcard h3 { margin-bottom: 4px; }
  .add { width: 100%; min-height: 64px; border: 2px dashed var(--brand); border-radius: 14px; background: transparent; color: var(--brand); font-weight: 500; font-size: 16px; }
  .opt { display: block; width: 100%; text-align: left; min-height: 48px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); margin: 6px 0; }
  .opt small { display: block; color: var(--muted); font-size: 12px; }

  /* тренировка */
  .clock { font-family: "Roboto Mono", monospace; font-size: 18px; font-weight: 700; }
  .ex { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin: 12px 0; }
  .ex-h { display: flex; align-items: flex-start; gap: 6px; }
  .ex-h .t { flex: 1; }
  .ex-h .t button { background: none; border: 0; padding: 0; text-align: left; font-weight: 500; font-size: 16px; color: var(--ink); }
  .iconbtn { min-width: 44px; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-size: 16px; }
  .sets { width: 100%; border-collapse: collapse; margin-top: 6px; }
  .sets th { font-size: 12px; font-weight: 400; color: var(--muted); text-align: left; padding: 2px 2px; }
  .sets td { padding: 3px 2px; vertical-align: middle; }
  .sets td.n { width: 24px; font-size: 14px; color: var(--muted); text-align: center; }
  .sets td.p { width: 72px; font-size: 12px; color: var(--muted); font-family: "Roboto Mono", monospace; }
  .sets input { min-height: 44px; padding: 6px 8px; text-align: center; font-family: "Roboto Mono", monospace; font-size: 16px; }
  .sets tr.ok input { background: var(--ok-soft); border-color: var(--ok); }
  .ck { width: 48px; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-size: 18px; color: var(--muted); }
  .ck.on { background: var(--ok); border-color: var(--ok); color: #fff; }
  .rest { margin-top: 8px; padding: 10px; border-radius: 12px; background: var(--soft); display: flex; align-items: center; gap: 6px; }
  .rest .clock { flex: 1; font-size: 18px; }
  .rest.end { background: var(--ok-soft); }
  .feel { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .feel button { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-size: 16px; }
  .feel button.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }
  .sum div { background: var(--card2); border-radius: 10px; padding: 8px 4px; }
  .sum b { display: block; font-size: 18px; font-family: "Roboto Mono", monospace; }
  .sum span { font-size: 12px; color: var(--muted); }

  /* упражнения */
  .groups { display: flex; gap: 6px; overflow-x: auto; padding: 6px 0; scrollbar-width: none; }
  .groups::-webkit-scrollbar { display: none; }
  .groups button { flex: 0 0 auto; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: 14px; }
  .groups button.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .exitem { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; min-height: 56px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); margin: 6px 0; }
  .exitem .t { flex: 1; }
  .exitem small { display: block; color: var(--muted); font-size: 12px; }
  .hist { font-size: 14px; padding: 8px 0; border-top: 1px solid var(--line); }
  .hist:first-child { border-top: 0; }
  .hist .mono { font-size: 14px; }
  svg.chart { width: 100%; height: 140px; display: block; }
  svg.chart text { font: 12px Rubik, sans-serif; fill: var(--muted); }

  /* программы */
  .pday { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
  .pitem { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; align-items: center; margin: 2px 0 6px; }
  .pname { display: flex; align-items: center; gap: 4px; margin-top: 10px; font-size: 14px; font-weight: 500; }
  .pname span { flex: 1; }
  .pitem input { min-height: 44px; padding: 6px; text-align: center; font-family: "Roboto Mono", monospace; }
    .pname button { min-height: 36px; min-width: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font-size: 14px; }
  .phead { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; font-size: 12px; color: var(--muted); text-align: center; }
  /* анкета */
  .qh { font-weight: 500; margin: 18px 0 6px; }
  .choice { display: flex; flex-wrap: wrap; gap: 6px; }
  .choice button { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 14px; }
  .choice button.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  /* чек-лист */
  .check { display: flex; align-items: center; gap: 10px; min-height: 44px; border-top: 1px solid var(--line); font-size: 14px; }
  .check:first-of-type { border-top: 0; }
  .check i { flex: 0 0 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); font-style: normal; display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .check.ok i { background: var(--ok); border-color: var(--ok); color: #fff; }
  .check.ok span { color: var(--muted); text-decoration: line-through; }
  .check span { flex: 1; }
  /* нагрузка */
  .verdict { border-left: 4px solid var(--brand); }
  .verdict.good { border-left-color: var(--ok); }
  .verdict.bad { border-left-color: var(--warn); }
  .gbar { display: grid; grid-template-columns: 72px 1fr 36px 64px; gap: 6px; align-items: center; font-size: 14px; min-height: 32px; }
  .gbar .tr { position: relative; height: 10px; border-radius: 5px; background: var(--card2); overflow: hidden; }
  .gbar .tr b { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: var(--brand); }
  .gbar .tr u { position: absolute; top: 0; bottom: 0; background: var(--ok); opacity: .25; }
  .gbar .lo { color: var(--warn); font-size: 12px; } .gbar .ok { color: var(--ok); font-size: 12px; } .gbar .hi { color: var(--warn); font-size: 12px; }
  .prow { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 48px; padding: 6px 0; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; font-size: 14px; }
  .prow .t { flex: 1; } .prow small { display: block; color: var(--muted); font-size: 12px; }
  .up { color: var(--ok); font-weight: 500; } .flat { color: var(--warn); font-weight: 500; }

  /* таймер */
  .big { font-family: "Roboto Mono", monospace; font-size: 72px; font-weight: 700; text-align: center; line-height: 1; margin: 12px 0 4px; }
  .phase { text-align: center; font-size: 18px; font-weight: 500; }
  .tphase-work { color: var(--warn); }
  .tphase-rest { color: var(--ok); }
  .presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

  table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.tbl td, table.tbl th { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; }
  table.tbl th { font-weight: 400; color: var(--muted); font-size: 12px; }
  details.box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 0 12px; margin: 10px 0; }
  details.box > summary { min-height: 48px; display: flex; align-items: center; font-weight: 500; cursor: pointer; list-style: none; }
  details.box > summary::-webkit-details-marker { display: none; }
  details.box > summary::after { content: "▾"; margin-left: auto; color: var(--muted); }
  details.box[open] > summary::after { content: "▴"; }
  details.box > div { padding-bottom: 12px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
(function () {
  var KEY = "podhod-data", TKEY = "podhod-timer";
  var GROUPS = ["Грудь", "Спина", "Ноги", "Плечи", "Руки", "Пресс", "Кардио", "Другое"];
  var KINDS = { wr: "вес и повторы", r: "повторы (свой вес)", t: "время" };
  var MONTHS = ["январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"];
  var MONTHS_G = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
  var WD = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];
  var WD_FULL = ["воскресенье", "понедельник", "вторник", "среда", "четверг", "пятница", "суббота"];

  // ---------- мелочи ----------
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function iso(d) { d = d || new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function pISO(s) { var p = s.split("-"); return new Date(+p[0], p[1] - 1, +p[2]); }
  function addDays(s, n) { var d = pISO(s); d.setDate(d.getDate() + n); return iso(d); }
  function num(v) { if (v == null || v === "") return null; var n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null; }
  function fN(n) { if (n == null) return ""; return String(Math.round(n * 100) / 100).replace(".", ","); }
  function fSec(s) { s = Math.max(0, Math.round(s)); var m = Math.floor(s / 60); return m + ":" + String(s % 60).padStart(2, "0"); }
  function pSec(v) { // «1:30», «90» → секунды
    if (v == null || v === "") return null; v = String(v).trim();
    if (v.indexOf(":") >= 0) { var p = v.split(":"); var m = parseInt(p[0], 10) || 0, s = parseInt(p[1], 10) || 0; return m * 60 + s; }
    var n = parseInt(v, 10); return isFinite(n) ? n : null;
  }
  function fDur(ms) { var m = Math.max(0, Math.round(ms / 60000)); return m < 60 ? m + " мин" : Math.floor(m / 60) + " ч " + (m % 60) + " мин"; }
  function dShort(s) { var d = pISO(s); return d.getDate() + "." + String(d.getMonth() + 1).padStart(2, "0"); }
  function dLong(s) { var d = pISO(s), t = WD_FULL[d.getDay()]; return t.charAt(0).toUpperCase() + t.slice(1) + ", " + d.getDate() + " " + MONTHS_G[d.getMonth()]; }
  function firstInt(s) { var m = String(s || "").match(/\d+/); return m ? +m[0] : null; }

  // ---------- начальные данные ----------
  var START_EX = [
    ["Жим штанги лёжа", "Грудь"], ["Жим гантелей лёжа", "Грудь"], ["Жим на наклонной скамье", "Грудь"], ["Разведение гантелей лёжа", "Грудь"],
    ["Сведение рук в кроссовере", "Грудь"], ["Отжимания на брусьях", "Грудь", "r"], ["Отжимания от пола", "Грудь", "r"],
    ["Подтягивания", "Спина", "r"], ["Тяга верхнего блока", "Спина"], ["Тяга штанги в наклоне", "Спина"], ["Тяга гантели одной рукой", "Спина"],
    ["Тяга горизонтального блока", "Спина"], ["Становая тяга", "Спина"], ["Гиперэкстензия", "Спина", "r"],
    ["Приседания со штангой", "Ноги"], ["Жим ногами", "Ноги"], ["Выпады с гантелями", "Ноги"], ["Румынская тяга", "Ноги"],
    ["Сгибание ног в тренажёре", "Ноги"], ["Разгибание ног в тренажёре", "Ноги"], ["Подъёмы на носки", "Ноги"], ["Ягодичный мост", "Ноги"],
    ["Болгарские сплит-приседания", "Ноги"],
    ["Жим штанги стоя", "Плечи"], ["Жим гантелей сидя", "Плечи"], ["Махи гантелями в стороны", "Плечи"], ["Махи в наклоне", "Плечи"], ["Тяга каната к лицу", "Плечи"],
    ["Подъём штанги на бицепс", "Руки"], ["Молотки с гантелями", "Руки"], ["Сгибание рук на скамье Скотта", "Руки"],
    ["Разгибание рук на блоке", "Руки"], ["Французский жим", "Руки"], ["Жим узким хватом", "Руки"],
    ["Скручивания", "Пресс", "r"], ["Подъём ног в висе", "Пресс", "r"], ["Планка", "Пресс", "t"], ["Ролик для пресса", "Пресс", "r"],
    ["Беговая дорожка", "Кардио", "t"], ["Велотренажёр", "Кардио", "t"], ["Гребной тренажёр", "Кардио", "t"], ["Скакалка", "Кардио", "t"]
  ];
  function seed() {
    var ex = START_EX.map(function (x, i) { return { id: "e" + (i + 1), name: x[0], group: x[1], kind: x[2] || "wr", note: "", video: "" }; });
    function byName(n) { for (var i = 0; i < ex.length; i++) if (ex[i].name === n) return ex[i].id; }
    function it(n, sets, reps, rest) { return { exId: byName(n), sets: sets, reps: reps, rest: rest }; }
    return {
      v: 1, exercises: ex,
      programs: [{
        id: "p1", name: "Пример: всё тело, 3 раза в неделю",
        days: [
          { id: "d1", name: "День А", items: [it("Приседания со штангой", 3, "8", 150), it("Жим штанги лёжа", 3, "8", 120), it("Тяга верхнего блока", 3, "10", 90), it("Махи гантелями в стороны", 3, "12-15", 60), it("Планка", 3, "45", 45)] },
          { id: "d2", name: "День Б", items: [it("Румынская тяга", 3, "8", 150), it("Жим гантелей сидя", 3, "10", 90), it("Тяга штанги в наклоне", 3, "8", 120), it("Подъём штанги на бицепс", 3, "10-12", 60), it("Скручивания", 3, "15", 45)] }
        ]
      }],
      workouts: [], body: [],
      settings: { rest: 90, sound: true, goal: "", height: "", backup: "" }
    };
  }

  // ---------- хранилище ----------
  var data;
  function load() {
    try { data = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { data = null; }
    if (!data || !data.exercises) data = seed();
    data.settings = Object.assign({ rest: 90, sound: true, goal: "", height: "", backup: "" }, data.settings || {});
    ["programs", "workouts", "body"].forEach(function (k) { if (!Array.isArray(data[k])) data[k] = []; });
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { flash("Не удалось сохранить: память браузера заполнена."); } }
  load();

  function exById(id) { for (var i = 0; i < data.exercises.length; i++) if (data.exercises[i].id === id) return data.exercises[i]; return { id: id, name: "Удалённое упражнение", group: "Другое", kind: "wr" }; }
  function wById(id) { for (var i = 0; i < data.workouts.length; i++) if (data.workouts[i].id === id) return data.workouts[i]; return null; }

  // ---------- график ----------
  function chart(pts) {
    var W = 360, H = 140, L = 34, R = 8, T = 10, B = 22;
    var ys = pts.map(function (p) { return p.y; }), mn = Math.min.apply(null, ys), mx = Math.max.apply(null, ys);
    if (mx === mn) { mx += 1; mn -= 1; }
    var pad = (mx - mn) * 0.1; mn -= pad; mx += pad;
    function X(i) { return L + (pts.length === 1 ? 0 : i * (W - L - R) / (pts.length - 1)); }
    function Y(v) { return T + (mx - v) * (H - T - B) / (mx - mn); }
    var path = pts.map(function (p, i) { return (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.y).toFixed(1); }).join(" ");
    var s = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="График">';
    [mn + pad, mx - pad].forEach(function (v) { s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="var(--line)"/><text x="2" y="' + (Y(v) + 4) + '">' + fN(Math.round(v * 10) / 10) + "</text>"; });
    s += '<path d="' + path + '" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/>';
    pts.forEach(function (p, i) { s += '<circle cx="' + X(i) + '" cy="' + Y(p.y) + '" r="3.5" fill="var(--brand)"/>'; });
    s += '<text x="' + L + '" y="' + (H - 4) + '">' + esc(pts[0].x) + '</text><text x="' + (W - R) + '" y="' + (H - 4) + '" text-anchor="end">' + esc(pts[pts.length - 1].x) + "</text>";
    return s + "</svg>";
  }

  // ---------- анализ нагрузки ----------
  function weeksBack(n) { var ws = weekStart(iso()), a = []; for (var i = n - 1; i >= 0; i--) a.push(addDays(ws, -7 * i)); return a; }

  function loadData() {

    var goal = (data.settings.profile && data.settings.profile.goal) || "mass", nr = GROUP_NORM[goal] || GROUP_NORM.mass;
    var g = groupSets(doneW().filter(function (w) { return w.date >= addDays(today, -6); }));

    var from = addDays(today, -55), prog = [];
    data.exercises.forEach(function (e) {
      var ses = [];
      doneW().forEach(function (w) {
        if (w.date < from) return;
        var m = 0;
        w.items.forEach(function (it) {
          if (it.exId !== e.id) return;
          doneSets(it).forEach(function (s) { m = Math.max(m, e.kind === "t" ? (s.t || 0) : (s.w ? e1rm(s.w, s.r) : (s.r || 0))); });
        });
        if (m) ses.push({ d: w.date, m: m });
      });
      if (ses.length < 2) return;

      if (ses.length >= 4) { ses.slice(0, -3).forEach(function (x) { best = Math.max(best, x.m); }); stall = ses.slice(-3).every(function (x) { return x.m <= best; }); }

  function importWorkouts(txt) {
    var a = txt.indexOf("{"), b = txt.lastIndexOf("}");
    if (a < 0 || b < a) throw new Error("в ответе нет JSON.");
    var j = JSON.parse(txt.slice(a, b + 1)), list = Array.isArray(j) ? j : j.workouts;
    if (!Array.isArray(list)) throw new Error("нет списка workouts.");
    var res = { added: 0, skipped: 0, newEx: 0 };
    list.forEach(function (x) {
      if (!x || !/^\d{4}-\d{2}-\d{2}$/.test(x.date || "") || !Array.isArray(x.items)) { res.skipped++; return; }
      var name = String(x.name || "Тренировка").trim();
      if (data.workouts.some(function (w) { return w.date === x.date && norm(w.name) === norm(name); })) { res.skipped++; return; }
      var start = pISO(x.date); start.setHours(12, 0, 0, 0);
      var dur = Math.max(10, Math.min(300, parseInt(x.durationMin, 10) || 60));
      var w = { id: uid(), date: x.date, name: name, status: "done", startedAt: start.getTime(), finishedAt: start.getTime() + dur * 60000, items: [], feel: null, note: "", programId: null, dayId: null, src: "import" };
      x.items.forEach(function (it) {

        var sets = it.sets.map(function (s) {

          var o = { w: num(s.w), r: s.r != null ? Math.round(num(s.r) || 0) : null, t: t || null, done: true };
          if (num(s.rir) != null) o.rir = num(s.rir);

        if (!sets.length) return;
        var e = findEx(nm);

          var kind = sets.some(function (s) { return s.t; }) ? "t" : sets.every(function (s) { return !s.w; }) ? "r" : "wr";
          e = { id: uid(), name: nm, group: GROUPS.indexOf(it.group) >= 0 ? it.group : "Другое", kind: kind, note: "", video: "" };

  function refreshList(id, fn) { // обновляем только список, чтобы поле поиска не теряло фокус
    var el = $(id); if (!el) return;
    var tmp = document.createElement("div"); tmp.innerHTML = fn();
    var src = tmp.querySelector("#" + id) || tmp;
    el.innerHTML = src.innerHTML;
  }

  // ---------- нажатия ----------
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-act]"); if (!t) return;
    var act = t.getAttribute("data-act"), v = t.getAttribute("data-v");
    var w = state.wid && wById(state.wid), p = state.progId && pById(state.progId);
    var path = (t.getAttribute("data-p") || "").split(":").map(Number), i = +t.getAttribute("data-i");
    var keep = false; // не перерисовывать
    switch (act) {
      case "tab": state.tab = v; state.pick = null; if (v === "home") state.wid = null; if (v === "ex") { state.exId = null; state.exEdit = null; } window.scrollTo(0, 0); break;
      case "week": state.day = addDays(state.day, +v); break;
      case "day": state.day = v; state.add = false; break;
      case "today": state.day = iso(); break;
      case "add": state.add = !state.add; break;
      case "new-empty": newWorkout("Тренировка", []); break;
      case "new-day":
        var pr = pById(t.getAttribute("data-p")), d = pr && pr.days.filter(function (x) { return x.id === t.getAttribute("data-d"); })[0];
        if (d) newWorkout(d.name, d.items, { p: pr.id, d: d.id });
        break;
      case "new-copy":
        var src = wById(v);
        if (src) newWorkout(src.name, src.items.map(function (it) { return { exId: it.exId, sets: it.sets.length, reps: (it.target || "").split("×")[1] || "", rest: it.rest }; }), src.programId ? { p: src.programId, d: src.dayId } : null);
        break;
      case "open": state.wid = v; state.tab = "home"; window.scrollTo(0, 0); break;
      case "back": state.wid = null; state.pick = null; window.scrollTo(0, 0); break;
      case "set-done":
        var it = w.items[path[0]], s = it.sets[path[1]], ex = exById(it.exId);
        audio();
        if (!s.done) {
          if (s.w == null && s.pw != null) s.w = s.pw;
          if (s.r == null && s.pr != null) s.r = s.pr;
          if (s.t == null && s.pt != null) s.t = s.pt;
          if (ex.kind === "wr" && (s.r == null || s.w == null)) { flash("Впишите вес и повторы подхода " + (path[1] + 1) + "."); break; }
          if (ex.kind === "r" && s.r == null) { flash("Впишите повторы подхода " + (path[1] + 1) + "."); break; }
          if (ex.kind === "t" && !s.t) { flash("Впишите время подхода " + (path[1] + 1) + "."); break; }
          s.done = true; s.at = Date.now();
          if (w.status === "active") {
            var lastEx = path[0] === w.items.length - 1 && it.sets.every(function (x) { return x.done; });
            if (!lastEx) startRest(w.id, path[0], it.rest);
          }
        } else s.done = false;
        save(); break;
      case "set-add":
        var it2 = w.items[i], ls = it2.sets[it2.sets.length - 1] || {};
        it2.sets.push({ w: null, r: null, t: null, done: false, pw: ls.w != null ? ls.w : ls.pw, pr: ls.r != null ? ls.r : ls.pr, pt: ls.t != null ? ls.t : ls.pt });
        save(); break;
      case "set-del": w.items[i].sets.pop(); save(); break;
      case "it-up": if (i > 0) { var x = w.items.splice(i, 1)[0]; w.items.splice(i - 1, 0, x); if (timer && timer.wid === w.id) { timer = null; saveTimer(); } save(); } break;
      case "it-del":
        if (!confirm("Убрать «" + exById(w.items[i].exId).name + "» из тренировки?")) { keep = true; break; }
        w.items.splice(i, 1); if (timer && timer.wid === w.id) { timer = null; saveTimer(); } save(); break;
      case "rest-add": if (timer) { timer.end = Math.max(Date.now(), timer.end) + (+v) * 1000; timer.fired = timer.end <= Date.now(); timer.warned = timer.end - Date.now() <= 5000; saveTimer(); } break;
      case "rest-stop": timer = null; saveTimer(); break;
      case "feel": w.feel = w.feel === +v ? null : +v; save(); break;
      case "finish":
        var undone = 0; w.items.forEach(function (it) { undone += it.sets.filter(function (s) { return !s.done; }).length; });
        if (undone && !confirm("Не отмечено подходов: " + undone + ". Завершить? Неотмеченные не попадут в итог.")) { keep = true; break; }
        w.status = "done"; w.finishedAt = Date.now(); if (timer && timer.wid === w.id) { timer = null; saveTimer(); } save(); window.scrollTo(0, 0); break;
      case "reopen": w.status = "active"; save(); break;
      case "del-w":
        if (!confirm("Удалить тренировку «" + w.name + "»? Это нельзя отменить.")) { keep = true; break; }
        data.workouts = data.workouts.filter(function (x) { return x !== w; }); if (timer && timer.wid === w.id) { timer = null; saveTimer(); } state.wid = null; save(); break;
      case "ai-one": openClaude(analysisText([w], "одна тренировка " + dShort(w.date)), "flash"); keep = true; break;

      case "pick": state.pick = { ctx: t.getAttribute("data-ctx"), d: +t.getAttribute("data-d") }; state.pickQ = ""; state.pickG = ""; break;
      case "pick-close": state.pick = null; break;
      case "pickg": state.pickG = v; break;
      case "pick-ex": addPicked(v); break;
      case "pick-new":
        var ne = { id: uid(), name: state.pickQ.trim(), group: state.pickG || "Другое", kind: state.pickG === "Кардио" ? "t" : "wr", note: "", video: "" };
        data.exercises.push(ne); addPicked(ne.id); break;

      case "exg": state.exG = v; break;
      case "ex-open": state.tab = "ex"; state.exId = v; state.exEdit = null; window.scrollTo(0, 0); break;
      case "ex-back": state.exId = null; break;
      case "ex-new": state.exEdit = "new"; break;
      case "ex-edit": state.exEdit = v; break;
      case "ex-cancel": state.exEdit = null; break;
      case "ex-save":
        var nm = $("fe-name").value.trim();
        if (!nm) { $("fe-msg").textContent = "Впишите название."; keep = true; break; }
        if (data.exercises.some(function (e) { return e.id !== v && e.name.toLowerCase() === nm.toLowerCase(); })) { $("fe-msg").textContent = "Такое упражнение уже есть."; keep = true; break; }
        var vid = $("fe-video").value.trim();
        if (vid && !/^https?:\/\//i.test(vid)) { $("fe-msg").textContent = "Ссылка должна начинаться с https://"; keep = true; break; }
        var ee = v ? exById(v) : { id: uid() };
        ee.name = nm; ee.group = $("fe-group").value; ee.kind = $("fe-kind").value; ee.video = vid; ee.note = $("fe-note").value.trim();
        if (!v) data.exercises.push(ee);
        save(); state.exEdit = null; state.exId = ee.id; break;
      case "ex-del":
        if (!confirm("Удалить упражнение?")) { keep = true; break; }
        data.exercises = data.exercises.filter(function (e) { return e.id !== v; }); save(); state.exEdit = null; state.exId = null; break;

      case "prog-new":
        var np = { id: uid(), name: "Новая программа", days: [{ id: uid(), name: "День 1", items: [] }] };
        data.programs.push(np); save(); state.progId = np.id; break;
      case "prog-open": state.progId = v; window.scrollTo(0, 0); break;
      case "prog-back": state.progId = null; state.pick = null; break;
      case "prog-del":
        if (!confirm("Удалить программу «" + p.name + "»? Прошлые тренировки останутся.")) { keep = true; break; }
        data.programs = data.programs.filter(function (x) { return x !== p; }); state.progId = null; save(); break;
      case "day-add": p.days.push({ id: uid(), name: "День " + (p.days.length + 1), items: [] }); save(); break;
      case "day-del":
        var dd = +t.getAttribute("data-d");
        if (p.days[dd].items.length && !confirm("Удалить «" + p.days[dd].name + "»?")) { keep = true; break; }
        p.days.splice(dd, 1); save(); break;
      case "pi-up": if (path[1] > 0) { var arr = p.days[path[0]].items, y = arr.splice(path[1], 1)[0]; arr.splice(path[1] - 1, 0, y); save(); } break;
      case "pi-del": p.days[path[0]].items.splice(path[1], 1); save(); break;
      case "prog-ai": state.aiPrompt = $("pr-wish").value.trim(); openClaude(progPrompt(), "pr-msg"); keep = true; break;
      case "prog-ai-copy": state.aiPrompt = $("pr-wish").value.trim(); copyText(progPrompt(), "pr-msg"); keep = true; break;
      case "prog-import":
        try { var ip = importProgram($("pr-json").value); state.aiPrompt = ""; state.progId = ip.id; flash("Программа «" + ip.name + "» создана. Проверьте упражнения и цифры."); }
        catch (e) { $("pr-msg").textContent = "Не получилось: " + (e.message || e); keep = true; }
        break;

      case "body-save":
        var rec = { id: state.bodyEdit || uid(), date: $("bd-date").value || iso() }, any = false;
        BODY_F.forEach(function (f) { var n = num($("bd-" + f[0]).value); if (n != null) { rec[f[0]] = n; any = true; } });
        if (!any) { flash("Впишите хотя бы один замер."); break; }
        data.body = data.body.filter(function (x) { return x.id !== rec.id; }); data.body.push(rec); state.bodyEdit = null; save(); flash("Замер сохранён."); break;
      case "body-edit": state.bodyEdit = v; window.scrollTo(0, 0); break;
      case "body-cancel": state.bodyEdit = null; break;
      case "body-del": if (!confirm("Удалить замер?")) { keep = true; break; } data.body = data.body.filter(function (x) { return x.id !== state.bodyEdit; }); state.bodyEdit = null; save(); break;

      case "iv-start":
        ivCfg = { work: Math.max(1, pSec($("iv-work").value) || 40), rest: Math.max(0, pSec($("iv-rest").value) || 0), rounds: Math.max(1, Math.min(99, parseInt($("iv-rounds").value, 10) || 1)), prep: Math.max(0, pSec($("iv-prep").value) || 0) };
        ivStart(ivCfg); break;
      case "cd": audio(); iv = { phases: [{ k: "rest", len: +v }], start: Date.now(), running: true, last: 0, rounds: 0 }; syncWake(); break;
      case "iv-pause": iv.running = false; iv.pausedAt = Date.now(); syncWake(); break;
      case "iv-resume": audio(); iv.start += Date.now() - iv.pausedAt; iv.running = true; syncWake(); break;
      case "iv-reset": iv = null; syncWake(); break;

      case "period": state.period = +v; break;
      case "q": state.q[t.getAttribute("data-k")] = v; break;
      case "qinj": var ij = state.q.inj = state.q.inj || [], k0 = ij.indexOf(v); if (k0 >= 0) ij.splice(k0, 1); else ij.push(v); break;
      case "quiz-open": state.q = null; state.tab = "quiz"; window.scrollTo(0, 0); break;
      case "quiz-skip": data.settings.quizDone = true; save(); state.tab = "home"; break;
      case "quiz-go":
        var qp = applyQuiz(state.q);
        state.tab = "prog"; state.progId = qp.id; window.scrollTo(0, 0);
        flash("Программа «" + qp.name + "» готова: " + qp.days.length + " дн. Тренировку начинают на главной.");
        break;
      case "check-hide": data.settings.checkHidden = true; save(); break;
      case "go-import": state.tab = "ai"; state.openImport = true; setTimeout(function () { var el = $("importBox"); if (el) el.scrollIntoView(); }, 0); break;
      case "go-body": state.tab = "body"; window.scrollTo(0, 0); break;
      case "imp-ai": openClaude(importPrompt(), "imp-msg"); keep = true; break;
      case "imp-ai-copy": copyText(importPrompt(), "imp-msg"); keep = true; break;
      case "imp-go":
        try { var rs = importWorkouts($("imp-json").value); state.openImport = true; flash("Перенесено тренировок: " + rs.added + (rs.skipped ? ", пропущено повторов: " + rs.skipped : "") + (rs.newEx ? ", новых упражнений: " + rs.newEx : "") + "."); }
        catch (e) { $("imp-msg").textContent = "Не получилось: " + (e.message || e); keep = true; }
        break;
      case "prog-row": state.tab = "ex"; state.exId = v; state.exEdit = null; window.scrollTo(0, 0); break;
      case "ai-go": var ws = periodWorkouts(state.period); openClaude(analysisText(ws, "последние " + state.period + " дн."), "ai-msg"); keep = true; break;
      case "ai-copy": copyText(analysisText(periodWorkouts(state.period), "последние " + state.period + " дн."), "ai-msg"); keep = true; break;
      case "export": exportData(); keep = state.tab === "ai"; break;
      case "import": $("impFile").click(); keep = true; break;
      default: keep = true;
    }
    if (!keep) render();
  });
  function addPicked(exId) {
    var pk = state.pick;
    if (pk.ctx === "w") { var w = wById(state.wid); w.items.push(makeItem(exId, w, null, "", null)); }
    else { var p = pById(state.progId); p.days[pk.d].items.push({ exId: exId, sets: 3, reps: "10", rest: data.settings.rest }); }
    save(); state.pick = null;
  }

  // ---------- копия ----------
  function exportData() {
    var blob = new Blob([JSON.stringify(data, null, 1)], { type: "application/json" });
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "podhod-" + iso() + ".json";
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    data.settings.backup = new Date().toISOString(); save();
    if ($("data-msg")) $("data-msg").textContent = "Копия скачана.";
  }
  document.addEventListener("change", function (ev) {
    if (ev.target.id !== "impFile" || !ev.target.files[0]) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var j = JSON.parse(r.result);
        if (!j || !Array.isArray(j.exercises) || !Array.isArray(j.workouts)) throw new Error("это не копия «Подхода»");
        if (!confirm("Заменить текущие данные копией? Тренировок в копии: " + j.workouts.length + ".")) return;
        localStorage.setItem(KEY, JSON.stringify(j)); load(); flash("Копия загружена."); render();
      } catch (e) { $("data-msg").textContent = "Не удалось загрузить: " + (e.message || e); }
    };
    r.readAsText(ev.target.files[0]);
  });

  if (!data.settings.quizDone && !data.workouts.length) state.tab = "quiz";
  render();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("../sw.js").catch(function () {});
})();
</script>
