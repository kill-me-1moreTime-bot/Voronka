# «Сказочные друзья»: проверка кода, тесты и сборка APK.
# Запускается только при изменениях в папке skazochnye_druzya/.
# APK: Actions → «Сказочные друзья» → запуск → Artifacts.
#
# Репозиторий публичный, поэтому ключи Yandex в сборку НЕ попадают:
# APK со страницы запуска может скачать любой, у кого есть аккаунт GitHub.
name: Сказочные друзья

on:
  push:
    paths:
      - 'skazochnye_druzya/**'
      - '.github/workflows/skazki.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: skazochnye_druzya

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Постоянный ключ подписи из секрета SKAZKI_KEYSTORE_BASE64 (Settings →
      # Secrets and variables → Actions). С ним APK ставится поверх прежнего
      # и настройки на телефоне сохраняются. Без секрета — отладочный ключ,
      # и такой APK встанет только после удаления приложения.
      - name: Ключ подписи
        env:
          KEYSTORE_B64: ${{ secrets.SKAZKI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/skazki.jks"
            echo "SKAZKI_KEYSTORE=$RUNNER_TEMP/skazki.jks" >> "$GITHUB_ENV"
            echo "Подпись постоянным ключом"
          else
            echo "::warning::Нет секрета SKAZKI_KEYSTORE_BASE64 — подпись отладочным ключом, APK не встанет поверх"
          fi

      # Как сборки на компьютере: release, только arm64 (почти все телефоны),
      # тот же номер версии — поэтому ставится поверх.
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64
        env:
          SKAZKI_STORE_PASSWORD: ${{ secrets.SKAZKI_STORE_PASSWORD || 'android' }}
          SKAZKI_KEY_ALIAS: ${{ secrets.SKAZKI_KEY_ALIAS || 'androiddebugkey' }}
          SKAZKI_KEY_PASSWORD: ${{ secrets.SKAZKI_KEY_PASSWORD || 'android' }}

      - uses: actions/upload-artifact@v4
        with:
          name: skazochnye-druzya-apk
          path: skazochnye_druzya/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14
